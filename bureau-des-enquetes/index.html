<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Douze enquêtes de lecture pour la première secondaire. Relève les indices, confronte les témoignages et résous chaque dossier."><title>Le Bureau des enquêtes</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');

pace-between;align-items:center;gap:20px}.back{background:none;border:0;color:var(--muted);padding:5px 0}.case-title h1{font-size:36px;margin:12px 0 28px}.workbench{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:25px;align-items:start}.paper{background:var(--paper);color:var(--ink);padding:35px 40px;border-radius:5px;box-shadow:0 15px 45px #0002}.paper-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #21333230;padding-bottom:16px;font-size:10px;letter-spacing:1.4px;color:#687068}.paper h2{font:26px Georgia;margin:24px 0 12px}.paper .instructions{font:12px/1.6 'DM Sans',sans-serif;color:#65706a;border-bottom:1px solid #21333220;padding-bottom:16px}.paragraph{font:var(--reading)/1.9 Georgia,serif;margin:18px -10px;padding:7px 10px;white-space:pre-line;cursor:pointer;border-left:3px solid transparent;border-radius:3px;transition:background .15s}.paragraph:hover{background:#e9ddc3}.paragraph.marked{background:#eadba5;border-left-color:#a67a2a}.paragraph.code{font:16px/1.8 'DM Sans',sans-serif;white-space:pre-wrap;border:1px dashed #9a8f72;padding:15px}.source{font-size:10px;color:#69746b;line-height:1.6;margin-top:30px}.side{position:sticky;top:20px}.question-box{background:var(--panel);border:1px solid var(--line);padding:25px;border-radius:5px}.steps{display:flex;gap:7px;margin-bottom:25px}.steps span{height:4px;flex:1;background:#ffffff25}.steps .done{background:#91baa2}.steps .current{background:var(--gold)}.qmeta{color:var(--gold);font-size:10px;letter-spacing:1.6px;text-transform:uppercase}.question-box h2{font:23px/1.4 Georgia;margin:15px 0 22px}.answers{display:grid;gap:10px}.answer{text-align:left;display:flex;gap:12px;align-items:flex-start;background:#ffffff03;border:1px solid #ffffff30;color:var(--paper);padding:14px;border-radius:4px;font-size:14px;line-height:1.5}.answer span{color:var(--gold);font-size:11px;padding-top:3px}.answer:hover:not(:disabled){border-color:var(--gold);background:#e8bd7212}.answer.correct{border-color:#97c7a4;background:#97c7a419}.answer.wrong{border-color:#e7a59b;background:#e7a59b14}.feedback{padding:16px 0 0;font-size:14px;line-height:1.7}.feedback strong{display:block;color:var(--gold);margin-bottom:5px}.feedback .primary{margin-top:15px;width:100%;justify-content:space-between}.timer{color:var(--gold);font-variant-numeric:tabular-nums;display:block;margin-top:9px}.notebook{margin-top:20px;border:1px solid var(--line);padding:20px;border-radius:5px;font-size:13px;color:var(--muted)}.notebook h3{font:19px Georgia;color:var(--paper);margin:0 0 12px}.notebook li{line-height:1.6;margin:10px 0}.notebook ul{padding-left:20px}.complete{text-align:center;padding:15px 0}.complete .stamp{font:48px Georgia;color:var(--gold);margin:10px}.complete p{color:var(--muted)}.complete .primary{margin:12px 0}.complete details{text-align:left;border-top:1px solid var(--line);padding-top:20px;margin-top:25px}.complete summary{cursor:pointer;color:var(--gold)}.complete details p{font-size:13px}.empty{color:var(--muted);padding:30px}body.large{--reading:21px}.notice{font-size:12px;color:var(--muted);margin-top:15px}.reset{margin-top:25px;font-size:11px;color:#9ab0ab}.reset button{font-size:11px;background:none;border:0;color:#9ab0ab;text-decoration:underline}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.workbench{grid-template-columns:1.1fr 1fr;gap:15px}.paper{padding:25px}.level{display:none}.question-box{padding:20px}}@media(max-width:730px){header{padding:18px 20px}main{padding:0 20px}.hero{grid-template-columns:1fr;padding-top:30px}.hero h1{font-size:44px}.desk{display:none}.stats{gap:15px}.stats strong{font-size:22px}.stats .progress{display:none}.section-head{display:block}.filters{margin-top:18px}.grid{grid-template-columns:1fr}.art{height:110px}.workbench{grid-template-columns:1fr}.side{position:static}.paper{padding:24px}.help{display:bl const CASES=[
{title:'La couronne dans le noir',place:'Château de Milbal',theme:'castle',icon:'♜',level:'Premiers indices',source:'La couronne des Ducs de la Bodinière',intro:'Une panne. Quatre témoignages. Une couronne disparue.',text:[
`La pluie frappe les hautes fenêtres du château de Milbal. À minuit, le duc découvre que la couronne exposée dans la galerie a disparu. La vitrine est intacte : quelqu’un a utilisé la clé rangée dans la cuisine. L’inspecteur Lafouine arrive au petit matin.`,
`Le registre technique indique une coupure complète de 23 h à minuit dans le bâtiment principal. Aucun générateur n’a fonctionné. Les dépendances, alimentées séparément, ont conservé leur électricité. Lafouine demande aux quatre employés de raconter cette heure précise.`,
`Valérie, qui habite le bâtiment principal, écoutait un concert dans sa chambre. Elle montre sa petite radio : elle fonctionne uniquement avec des piles. Marthe affirme avoir terminé ses mots croisés à la lumière d’une bougie. Une goutte de cire a d’ailleurs durci sur sa grille.`,
`Paul, le majordome, déclare : « J’ai regardé un film de 23 h à minuit, sans interruption, sur le téléviseur de ma chambre. » Son appareil, installé dans le bâtiment principal, doit être branché au mur et ne possède aucune batterie. Firmin, le chauffeur, dit avoir nettoyé la voiture dans le garage des dépendances.`,
`Sur sa feuille, Lafouine sépare les faits vérifiés des simples déclarations. Une contradiction lui saute aux yeux. Il ne peut pas encore affirmer avoir retrouvé le voleur, mais il sait quel témoignage doit être vérifié en priorité.`],questions:[
Q('Repérer','Quel secteur a subi la coupure de courant ?',['Le bâtiment principal seulement.','Les dépendances seulement.','Tout le domaine, garage compris.','La galerie seulement.'],'Le registre précise que les dépendances avaient une alimentation séparée.','Relis le registre technique.'),
Q('Comprendre','Pourquoi le récit de Valérie reste-t-il possible ?',['Sa radio utilise des piles.','Le concert avait lieu après minuit.','Sa chambre se trouve dans les dépendances.','La panne concernait seulement la vitrine.'],'Des piles permettent à cette radio de fonctionner sans l’électricité du bâtiment.','Observe le fonctionnement de son appareil.'),
Q('Croiser les indices','Quels renseignements faut-il rapprocher pour vérifier le récit de Paul ?',['L’heure de la panne et l’alimentation du téléviseur.','La pluie et la hauteur des fenêtres.','La disparition de la clé et la cire sur la grille.','Le métier de Firmin et le titre du film.'],'Paul situe son film pendant la panne et son téléviseur ne fonctionne que sur secteur.','Compare une heure à une contrainte technique.'),
Q('Conclure','Quelle conclusion respecte les preuves ?',['Le témoignage de Paul contredit les faits; il faut approfondir.','La cire prouve que Marthe a volé la couronne.','Valérie ment puisque tout appareil nécessite une prise.','Le métier de Paul suffit à prouver sa culpabilité.'],'Le mensonge fragilise son alibi, mais ne constitue pas à lui seul une preuve du vol.','Distingue une contradiction d’une preuve de culpabilité.') ]},
{title:'Le silence du chapiteau',place:'Cirque Magnifico',theme:'circus',icon:'✦',level:'Premiers indices',source:'Le cirque Magnifico',intro:'Sous les guirlandes éteintes, un bruit manque à l’appel.',text:[
`Le spectacle est terminé. Les gradins du cirque Magnifico se vident et les guirlandes rouges s’éteignent une à une. Marcello, le directeur, dépose la mallette contenant la recette dans son bureau. Il s’absente de 22 h 10 à 22 h 20 pour fermer le chapiteau. À son retour, la mallette n’est plus là.`,
`Pendant ces dix minutes, Marcello a longé les caravanes. Il est certain d’une chose : le terrain était silencieux. Une caméra sans son confirme son trajet, qui passait juste devant la caravane d’Armando. Aucun véhicule ni aucune musique ne couvrait les bruits du terrain.`,
`Lafouine recueille les témoignages. Paulo recousait son costume dans sa loge. Césario et Filippo soupaient ensemble; une employée les a vus tous les deux à table pendant toute la période. Armando affirme : « De 22 h 10 à 22 h 20, j’ai aiguisé mes accessoires sur ma meule électrique, dehors, sous mon auvent. Je n’ai pas arrêté. »`,
`L’inspecteur demande une démonstration. La meule produit un grincement puissant, bien audible sur tout le trajet de Marcello. Armando confirme qu’il s’agit du même appareil, au même endroit et au même réglage que la veille.`,
`Un costume à réparer et un repas tardif ne donnent aucune certitude sur le contenu de la mallette. En revanche, la comparaison entre une déclaration et un son permet à Lafouine de repérer un alibi impossible.`],questions:[
Q('Repérer','Quand la mallette a-t-elle disparu ?',['Entre 22 h 10 et 22 h 20.','Pendant tout le spectacle.','Après le départ de Lafouine.','Entre 21 h 10 et 22 h 10.'],'Marcello la dépose avant son absence et constate sa disparition à son retour.','Encadre les deux moments du premier paragraphe.'),
Q('Vocabulaire','Dans ce texte, un « alibi » désigne…',['Un récit qui situe une personne ailleurs au moment des faits.','Un objet laissé sur les lieux du vol.','Une accusation confirmée par un juge.','Un instrument utilisé pour ouvrir une porte.'],'Armando présente une activité censée l’empêcher d’être au bureau pendant le vol.','Demande-toi pourquoi Armando précise son activité et son horaire.'),
Q('Croiser les indices','Pourquoi la démonstration de la meule est-elle utile ?',['Elle permet de comparer le bruit attendu au silence rapporté.','Elle prouve que Marcello a ouvert la mallette.','Elle confirme le repas des deux artistes.','Elle révèle une panne dans les guirlandes.'],'Le même appareil aurait été audible depuis le trajet confirmé de Marcello.','Quel sens permet de vérifier cette déclaration ?'),
Q('Conclure','Quel témoignage contient la contradiction décisive ?',['Celui d’Armando : sa meule aurait rompu le silence.','Celui de Paulo : un costume ne peut pas se déchirer.','Celui de Césario : on ne soupe pas après un spectacle.','Celui de Marcello : une caméra enregistre toujours le son.'],'L’appareil bruyant ne peut avoir fonctionné sans arrêt dans les conditions décrites.','Rapproche « sans arrêt » et « silencieux ».') ]},
{title:'Les éclats sur la terrasse',place:'Château de Saint-Sauveur',theme:'castle',icon:'◇',level:'Premiers indices',source:'Le faux cambriolage',intro:'Une fenêtre brisée ne raconte pas toujours la bonne histoire.',text:[
`Daphné de Saint-Sauveur reçoit Lafouine devant un coffre ouvert. Ses bijoux ont disparu. Les rideaux du salon flottent dans l’air frais, et un trou déchire la grande vitre qui donne sur la terrasse. La propriétaire affirme qu’un inconnu a fracassé la fenêtre depuis le jardin, puis a traversé le salon pour forcer le coffre.`,
`La maison nécessite des travaux coûteux. Daphné explique qu’elle comptait vendre quelques bijoux pour les payer. Elle a déjà demandé à son assureur de préparer un remboursement. Son besoin d’argent intéresse Lafouine, sans lui permettre de conclure quoi que ce soit.`,
`L’experte examine la vitre. Elle explique que, pour ce panneau encore fixé dans son cadre, les éclats principaux sont projetés du côté opposé au choc. Aucun éclat n’a été déplacé : une caméra intérieure montre la pièce vide depuis le bris jusqu’à l’arrivée des policiers. Elle ne filme toutefois pas la fenêtre.`,
`Lafouine regarde le plancher : il n’y voit presque aucun verre. La plupart des gros morceaux reposent dehors, sur la terrasse, juste sous la fenêtre. Sur le tapis, un outil porte des traces du coffre; cela confirme que le coffre a été forcé, mais pas par qui.`,
`Avant que l’assureur signe un document, l’inspecteur lui demande d’attendre. Il faut d’abord expliquer une incohérence matérielle dans la manière dont Daphné raconte l’entrée du cambrioleur.`],questions:[
Q('Repérer','Selon Daphné, d’où le coup contre la vitre a-t-il été donné ?',['Du jardin, vers l’intérieur.','Du salon, vers la terrasse.','Du toit, vers le jardin.','Du coffre, vers le couloir.'],'Elle affirme que l’inconnu a frappé depuis le jardin.','La question porte sur sa version, pas encore sur la conclusion.'),
Q('Distinguer','Quel élément constitue une observation matérielle ?',['Les gros morceaux de verre sont sur la terrasse.','Daphné serait certainement coupable puisqu’elle a besoin d’argent.','Le voleur serait un proche de la propriétaire.','L’assureur aurait déjà accepté de tout rembourser.'],'La position des éclats est observée; les autres propositions ajoutent des conclusions ou des faits absents.','Cherche ce que Lafouine peut réellement constater.'),
Q('Déduire','D’après l’explication de l’experte, d’où vient probablement le choc ?',['De l’intérieur du salon.','De l’extérieur du jardin.','De l’intérieur du coffre.','Du toit du château.'],'Les principaux éclats sont dehors, du côté opposé au choc.','Situe les éclats par rapport au côté frappé.'),
Q('Conclure','Pourquoi faut-il vérifier la déclaration de Daphné ?',['La position du verre contredit le sens du choc qu’elle décrit.','Toute personne qui réclame un remboursement ment.','Un outil sur un tapis prouve l’identité de son utilisateur.','Le coût des travaux prouve à lui seul une mise en scène.'],'La contradiction repose sur le verre et les conditions vérifiées, pas sur les difficultés financières.','Privilégie la preuve matérielle au motif possible.') ]},
{title:'Un détail de trop',place:'Manoir des Hautes Bruyères',theme:'manor',icon:'☕',level:'Croiser les indices',source:'Le manoir des Hautes Bruyères',intro:'Au salon, quelqu’un en sait plus qu’il ne devrait.',text:[
`Au manoir des Hautes Bruyères, le déjeuner s’est interrompu brusquement. Madame Farington a été prise d’un malaise. Elle se repose maintenant à l’hôpital et son état est stable. Les analyses indiquent qu’une substance interdite a été ajoutée à l’un des aliments ou à l’une des boissons du repas.`,
`Lafouine réunit trois personnes dans le salon. Il leur annonce seulement : « Quelqu’un a altéré le déjeuner. Nous cherchons à comprendre ce qui s’est passé. » Ni le médecin ni les policiers n’ont révélé quel plat ou quelle boisson est concerné. Les résultats détaillés ne sont pas encore arrivés.`,
`Hélène, la cuisinière, explique qu’elle s’est disputée avec sa patronne au sujet du menu. « Mais je ne lui aurais jamais fait de mal », ajoute-t-elle. Sophie, qui s’occupe des chambres, dit avoir apporté des fleurs avant le repas. George, le neveu, admet qu’il voulait emprunter de l’argent à sa tante.`,
`Lorsque Lafouine lui demande pourquoi il était pressé de quitter la maison, George réplique : « Ce n’est pas parce que je suis parti tôt que j’ai versé cette substance dans sa tisane ! » L’inspecteur cesse d’écrire. Il n’avait parlé que du déjeuner. Plusieurs boissons et plusieurs plats avaient été servis.`,
`Lafouine ne confond pas une dispute avec une preuve. Il note plutôt les mots exacts de George. Ce détail inattendu mérite une explication : comment le neveu a-t-il choisi une boisson précise alors que l’enquête ne l’a pas identifiée publiquement ?`],questions:[
Q('Repérer','Qu’a annoncé Lafouine aux trois personnes ?',['Quelqu’un a altéré le déjeuner.','La tisane contenait la substance.','La cuisinière est responsable.','Les analyses détaillées sont terminées.'],'Son annonce reste volontairement générale.','Relis les paroles exactes de l’inspecteur.'),
Q('Interpréter','Pourquoi la dispute d’Hélène ne suffit-elle pas à l’accuser ?',['Un désaccord ne démontre pas qu’elle a altéré un aliment.','La cuisinière n’a jamais accès aux repas.','Sophie confirme toute sa journée.','Madame Farington a retiré sa plainte.'],'Un motif possible et une action prouvée sont deux choses différentes.','Le texte prouve-t-il un geste ou décrit-il seulement une tension ?'),
Q('Croiser les indices','Quel mot de George attire spécialement l’attention ?',['« Tisane », car la boisson n’avait pas été désignée.','« Parti », car personne ne pouvait sortir.','« Tôt », car le déjeuner avait lieu à minuit.','« Tante », car leur lien familial était inconnu.'],'George désigne spontanément un élément précis du repas.','Compare sa réponse à l’annonce générale de Lafouine.'),
Q('Conclure','Quelle suite d’enquête est la plus justifiée ?',['Demander à George comment il connaît ce détail et vérifier sa réponse.','Accuser Hélène uniquement à cause de la dispute.','Innocenter George puisqu’il nie les faits.','Arrêter Sophie parce qu’elle a apporté des fleurs.'],'La connaissance inexpliquée d’un détail est une piste à vérifier, pas une preuve complète.','Choisis une démarche fondée sur l’indice relevé.') ]},
{title:'Le timbre entre deux pages',place:'Cabinet des assurances',theme:'archive',icon:'▤',level:'Croiser les indices',source:'Le five pence of Trinidad',intro:'Une déclaration très précise cache une impossibilité.',text:[
`Jacques Malus pose une enveloppe sur son bureau. Son client, Jean Veuplusse, affirme avoir perdu un timbre de collection dans l’incendie de sa bibliothèque. L’objet, une pièce unique selon les experts, était assuré pour une somme considérable. La compagnie a versé l’indemnité il y a six mois.`,
`Or, un catalogue récent annonce la vente d’un timbre qui paraît identique. Les experts devront encore vérifier s’il s’agit bien de l’original. Lafouine refuse de se fier uniquement à une photographie : une ressemblance ne permet pas, à elle seule, d’identifier un objet.`,
`Malus lui montre ensuite une déclaration écrite avant l’incendie. Jean y indiquait : « Mon timbre est glissé, sans collage ni découpe, entre les pages 43 et 44 de mon exemplaire des Trois Mousquetaires. » Le client a signé au bas de la feuille.`,
`L’exemplaire était un livre ordinaire, imprimé recto verso, sans feuillet manquant ni erreur de pagination. Malus précise une règle utile : dans ce livre, chaque numéro impair est au recto d’un feuillet et le numéro pair suivant est au verso du même feuillet.`,
`Lafouine prend un autre livre fabriqué de la même façon et tourne quelques pages. Il comprend que la déclaration présente un problème indépendant du catalogue. Avant de chercher où se trouve réellement le timbre, il faut vérifier si la cachette décrite a seulement pu exister.`],questions:[
Q('Repérer','Quel document décrit la cachette avant l’incendie ?',['La déclaration signée par Jean.','Le catalogue de vente récent.','Le rapport des pompiers.','Le roman écrit par Lafouine.'],'La déclaration antérieure précise les numéros de pages.','Repère le document daté avant le sinistre.'),
Q('Comprendre','Dans ce livre, les pages 43 et 44 sont…',['Les deux faces d’un même feuillet.','Deux faces placées en regard.','Deux feuilles séparées par une page blanche.','La couverture et sa doublure.'],'43 est impair et 44 est le numéro pair immédiatement suivant.','Applique la règle de pagination fournie.'),
Q('Déduire','Pourquoi la cachette déclarée pose-t-elle problème ?',['On ne peut rien glisser entre les deux faces d’un feuillet intact.','Un timbre est toujours plus grand qu’un livre.','Les romans ne comportent jamais de page 44.','Un incendie laisse nécessairement les timbres intacts.'],'Sans découper ni décoller le feuillet, aucun espace n’existe entre ces deux faces.','Imagine le recto et le verso d’une feuille unique.'),
Q('Conclure','Que permet d’affirmer cette contradiction ?',['La cachette déclarée est impossible dans les conditions décrites.','Le vendeur du catalogue est forcément Jean.','Tous les experts ont menti sur le timbre.','Le timbre n’a jamais existé.'],'La déclaration est contredite; l’identité du vendeur et l’emplacement réel restent à établir.','Ne dépasse pas ce que la pagination démontre.') ]},
{title:'Le panier du pêcheur',place:'Jetée de l’Océan',theme:'port',icon:'⚓',level:'Croiser les indices',source:'Pêche en mer',intro:'Sur le quai, les prises ne correspondent pas toutes au récit.',text:[
`Une brume légère enveloppe la jetée. Lafouine et son collègue Jo Vial viennent à peine de lancer leurs lignes lorsque deux policiers arrivent. Un vol a eu lieu à la bijouterie du port à 8 h 15. Un témoin a vu quelqu’un courir vers le quai, mais n’a pas distingué son visage.`,
`Trois pêcheurs acceptent de répondre. Yves dit être arrivé à l’aube et montre deux poissons de mer. Pierre-Paul assure : « J’ai pris tous ces poissons ici, au bout de la jetée, ce matin. Je ne suis pas parti une seule minute. » Dans son panier, les policiers identifient un brochet et un sandre.`,
`Victor reconnaît une absence : « Je suis allé déjeuner au café de 8 h à 8 h 30. » La serveuse et les images du café confirment qu’il y est resté pendant toute cette période. Il est donc bien sorti du quai, mais son déplacement est vérifiable.`,
`Un panneau pédagogique, fixé près des cannes, explique que le brochet et le sandre sont des poissons d’eau douce. Un biologiste présent précise que ces deux espèces ne peuvent pas avoir été pêchées dans l’eau de mer de cette jetée. Aucun cours d’eau ne se jette à proximité.`,
`Lafouine observe le panier de Pierre-Paul. Peut-être a-t-il simplement acheté ses poissons pour se vanter; peut-être cache-t-il un déplacement. Pour l’instant, l’inspecteur a repéré un récit incompatible avec les prises. Il lui reste à déterminer si ce mensonge a un lien avec le vol.`],questions:[
Q('Repérer','Quel événement a amené les policiers sur la jetée ?',['Un vol à la bijouterie à 8 h 15.','La disparition d’une canne à pêche.','Un accident au café à 8 h 30.','Une plainte concernant le panneau.'],'Le témoin a vu une personne quitter la bijouterie vers le quai.','Reviens à l’arrivée des policiers.'),
Q('Comprendre','Pourquoi l’absence de Victor n’est-elle pas automatiquement suspecte ?',['Son séjour au café pendant le vol est confirmé.','Il possède forcément un permis de pêche.','Il affirme avoir capturé plus de poissons.','Le café appartient à Lafouine.'],'Deux sources confirment son emplacement au moment important.','Cherche ce qui vérifie son récit.'),
Q('Croiser les indices','Quelle comparaison met Pierre-Paul en difficulté ?',['Les espèces de son panier et le milieu où il dit les avoir pêchées.','L’épaisseur de la brume et la longueur de sa canne.','Son heure d’arrivée et le prix des bijoux.','Le nombre de policiers et le nombre de poissons.'],'Le brochet et le sandre ne correspondent pas à l’eau de mer de la jetée.','Relie sa phrase au renseignement du biologiste.'),
Q('Conclure','Quelle conclusion est suffisamment prudente ?',['Pierre-Paul ment sur ses prises; son rôle dans le vol reste à vérifier.','Pierre-Paul a nécessairement volé les bijoux.','Victor est coupable puisqu’il admet une absence.','Yves est coupable puisqu’il est arrivé tôt.'],'Le texte établit une contradiction, mais laisse plusieurs explications possibles.','Un mensonge sur la pêche prouve-t-il le vol ?') ]},
{title:'La maison introuvable',place:'Quartier des vieux jardins',theme:'manor',icon:'⌂',level:'Premiers indices',source:'La maison idéale',intro:'Quatre adresses, trois critères et un carnet à récupérer.',text:[
`Carmen entre au bureau de Lafouine avec une liste d’adresses. Sa sœur Conchita a commencé un emploi de restauration de meubles. Elle a égaré son téléphone et laissé son carnet de dessins chez son employeur. De retour chez elle après un trajet en taxi, elle ne se souvient plus du nom de la rue.`,
`Conchita se rappelle toutefois trois caractéristiques très précises. La maison a plus de cent ans. Toutes ses pièces se trouvent au rez-de-chaussée : elle est de plain-pied. Enfin, le jardin est calme, loin des routes passantes et des installations bruyantes. L’agence confirme que l’emploi se trouve à l’une des quatre adresses de la liste.`,
`Lafouine visite d’abord John Équerre. Sa demeure, construite il y a cinq ans, s’étend sur un seul niveau au milieu d’un parc tranquille. Chez le comte Hébon, la maison date de 1880, mais la bibliothèque où l’on restaure les meubles se trouve au troisième étage.`,
`Justin Coudefeu accueille ensuite l’inspecteur dans un manoir de 1895. Toutes les pièces occupent le rez-de-chaussée et le jardin donne sur une prairie silencieuse. La dernière adresse est celle de Martin Pêcheur. Son ancienne maison n’a pas d’étage, mais sa clôture borde les pistes d’un aéroport; les décollages interrompent constamment la conversation.`,
`Plusieurs propriétés possèdent un beau jardin. Cette ressemblance ne suffit pas. Lafouine compare chaque adresse aux trois critères ensemble. Une seule les respecte tous : c’est là qu’il demandera à chercher le carnet.`],questions:[
Q('Vocabulaire','Que signifie « de plain-pied » dans ce texte ?',['Toutes les pièces sont au rez-de-chaussée.','La maison possède un grand escalier.','La maison est située au pied d’une montagne.','Le jardin est entièrement pavé.'],'La description de Conchita donne directement le sens du terme.','Lis la phrase qui précède les mots « de plain-pied ».'),
Q('Repérer','Pourquoi la demeure de John est-elle écartée ?',['Elle est trop récente.','Elle borde un aéroport.','Elle comporte trois étages.','Elle n’a pas de jardin.'],'Construite il y a cinq ans, elle n’a pas plus de cent ans.','Quel critère concerne son âge ?'),
Q('Croiser les indices','Quel critère élimine la maison de Martin ?',['Le calme du jardin.','L’ancienneté de la maison.','L’absence d’étage.','La présence d’une clôture.'],'Les pistes de l’aéroport rendent le lieu bruyant.','Ne confonds pas « ancienne » et « tranquille ». '),
Q('Conclure','Quelle adresse correspond à tous les souvenirs ?',['Celle de Justin Coudefeu.','Celle de John Équerre.','Celle du comte Hébon.','Celle de Martin Pêcheur.'],'Le manoir de Justin est ancien, de plain-pied et situé dans un environnement calme.','Vérifie les trois critères, pas seulement deux.') ]},
{title:'L’acrostiche du témoin',place:'Archives municipales',theme:'archive',icon:'✒',level:'Messages secrets',source:'Une confession tardive',intro:'Six lignes ordinaires peuvent cacher un prénom.',text:[
`Aux archives municipales, un registre de plans anciens manque à l’appel. Le gardien a aperçu quelqu’un quitter la salle réservée au personnel, mais il préfère transmettre discrètement son nom. Il remet à Lafouine une enveloppe portant cette indication : « Le prénom est dans l’acrostiche. »`,
`L’inspecteur dispose de quatre noms : Régis, Julien, Francis et Vincent. Ils travaillaient tous dans le bâtiment ce matin-là. Régis réparait une armoire; Julien classait les plans; Francis préparait une exposition; Vincent livrait des boîtes. Le métier de chacun ne suffit pas à le rendre responsable.`,
`Une note de vocabulaire accompagne le message. Un acrostiche est un texte dont les premières lettres des lignes, lues de haut en bas, forment un mot. Le témoin précise de conserver exactement les six lignes suivantes :`,
`Je garde un souvenir précis de ce matin.\nun dossier attendait près de la porte.\nles fenêtres étaient encore fermées.\nIl faisait frais dans la grande salle.\nen sortant, un homme portait le registre.\nnul autre ne suivait ses pas.`,
`Lafouine ne cherche ni un mot caché au milieu des phrases ni la dernière lettre de chaque ligne. Il suit la consigne donnée. Le prénom obtenu indique qui le témoin affirme avoir vu. Il faudra ensuite vérifier cette affirmation et comprendre pourquoi le registre a été emporté.`],questions:[
Q('Repérer','Quel objet a disparu ?',['Un registre de plans anciens.','Une enveloppe contenant de l’argent.','Une armoire de classement.','Un tableau de l’exposition.'],'L’absence du registre déclenche l’enquête.','Relis la première phrase.'),
Q('Comprendre','Comment faut-il lire cet acrostiche ?',['Prendre la première lettre de chaque ligne, de haut en bas.','Prendre la dernière lettre de chaque phrase.','Lire uniquement les mots écrits en majuscules.','Compter les lettres dans chaque métier.'],'La note de vocabulaire fournit explicitement la méthode.','Utilise la définition donnée, pas une autre forme de code.'),
Q('Appliquer','Que donnent les trois premières lignes ?',['JUL.','JUF.','REG.','VIN.'],'Les lignes commencent par « Je », « un » et « les ».','Ignore la longueur des phrases; observe leur début.'),
Q('Conclure','Comment interpréter le message complet ?',['Le témoin désigne Julien; son témoignage doit être vérifié.','Le message prouve que Régis a détruit le registre.','Le message innocente tous les employés.','Le code désigne Francis parce qu’il prépare une exposition.'],'Les initiales J-U-L-I-E-N forment le prénom Julien, mais une déclaration reste à vérifier.','Assemble les six initiales dans leur ordre.') ]},
{title:'Les mots après le point',place:'Bureau des objets retrouvés',theme:'archive',icon:'✉',level:'Messages secrets',source:'Message codé',intro:'Une lettre banale dissimule l’emplacement d’un écrin.',text:[
`Un écrin contenant des pierres de collection a disparu pendant une exposition. Les caméras ont permis d’identifier Samuel au moment où il l’emportait. L’objet reste toutefois introuvable. Samuel a laissé à un complice une courte lettre que Lafouine examine avec attention.`,
`Au dos, une inscription indique : « Après chaque point, garde le quatrième mot. » Le premier mot de la lettre, « Bonjour », sert seulement d’introduction. La note précise qu’un mot est ici un groupe séparé des autres par des espaces; il n’y a ni apostrophe ni mot composé dans les quatre phrases à décoder.`,
`Bonjour. Tu retrouveras les pierres demain. Je regarde toujours sous mes pieds. Nous admirons tous le jardin. Tu nettoieras ce banc samedi.`,
`Lafouine compte méthodiquement, en recommençant à un après chaque point. Il ne prend pas la quatrième lettre d’un mot : la consigne parle bien de mots. Il conserve les résultats dans l’ordre de lecture pour former une indication de lieu.`,
`Le jardin de l’exposition contient une fontaine, une statue et un unique banc de pierre. La lettre décrit plusieurs activités ordinaires, mais celles-ci servent surtout à transporter le message secret. Une fois les quatre mots assemblés, Lafouine pourra demander à son équipe de vérifier l’endroit désigné.`],questions:[
Q('Repérer','Combien de phrases doivent être décodées après « Bonjour » ?',['Quatre.','Trois.','Cinq.','Six.'],'Le point après Bonjour est suivi de quatre phrases distinctes.','Ne compte pas l’introduction comme une phrase à décoder.'),
Q('Appliquer','Quel est le quatrième mot de « Tu retrouveras les pierres demain » ?',['pierres','retrouveras','les','demain'],'Tu = 1, retrouveras = 2, les = 3, pierres = 4.','Repars de un au début de la phrase.'),
Q('Comprendre','Pourquoi faut-il recommencer le compte à chaque phrase ?',['La consigne s’applique après chaque point.','Tous les mots comportent quatre lettres.','La lettre doit être lue de droite à gauche.','Seuls les noms d’objets sont comptés.'],'Le point marque chaque nouveau départ du comptage.','Relis les quatre premiers mots de l’instruction.'),
Q('Conclure','Quel endroit le message désigne-t-il ?',['Sous le banc du jardin.','Sous la fontaine du jardin.','Derrière la statue du jardin.','Dans le bureau de Samuel.'],'Les mots retenus sont « pierres », « sous », « le », « banc ».','Aligne le quatrième mot des quatre phrases.') ]},
{title:'Le legs de l’océan',place:'Étude du notaire Bonnot',theme:'port',icon:'≋',level:'Messages secrets',source:'Le testament du Comte',intro:'Un code de lettres protège un don pour la mer.',text:[
`Le comte de Becdelièvre a confié au notaire Bonnot un don destiné à l’association Sauvons la mer. Avant de remettre les documents à l’association, le notaire doit retrouver l’enveloppe où le comte les a rangés. Quatre enveloppes scellées sont conservées dans son étude; chacune porte un numéro.`,
`Le comte aimait les énigmes. Sur une carte, il a laissé deux règles bien distinctes. Pour lire les mots, il faut remplacer les nombres par les lettres de l’alphabet : 1 = A, 2 = B, jusqu’à 26 = Z. Pour lire le numéro final, il faut utiliser un autre tableau : A = 0, B = 1, C = 2, D = 3, E = 4, F = 5, G = 6, H = 7, I = 8, J = 9.`,
`Le message se présente ainsi :\n(13-5-18) : CFJEAH`,
`Bonnot pense d’abord utiliser la même règle partout. Lafouine lui rappelle que le comte a explicitement distingué les mots du numéro. L’inspecteur décode donc le groupe de trois nombres, puis les six lettres placées après les deux-points.`,
`Les enveloppes portent les numéros 259407, 361518, 259408 et 952704. Elles sont toutes identiques et aucune ne présente de trace d’ouverture. L’association attend le document pour financer le nettoyage d’une plage. Trouver la bonne enveloppe permettra d’avancer; choisir au hasard risquerait simplement d’ouvrir un autre dossier.`],questions:[
Q('Repérer','À quoi le don est-il destiné ?',['À une association qui protège la mer.','À la rénovation du bureau de Lafouine.','À la construction d’un château.','À l’achat d’une nouvelle voiture.'],'Sauvons la mer attend les documents pour financer le nettoyage d’une plage.','Cherche le bénéficiaire dans le premier paragraphe.'),
Q('Appliquer','Avec la première règle, que signifie 13-5-18 ?',['MER','LAC','SEL','ILE'],'13 = M, 5 = E et 18 = R.','La première règle commence à A = 1.'),
Q('Comparer','Quelle différence essentielle distingue les deux règles ?',['A vaut 1 pour les mots, mais 0 pour le numéro.','Les deux règles commencent à A = 1.','Le numéro se lit obligatoirement à l’envers.','Les mots doivent être lus sans voyelles.'],'La seconde table décale la valeur des lettres d’une unité.','Compare la valeur de A dans les deux tableaux.'),
Q('Conclure','Quelle enveloppe faut-il ouvrir ?',['259407','361518','259408','952704'],'Avec A = 0, C = 2, F = 5, J = 9, E = 4, A = 0 et H = 7.','Décode les six lettres sans changer leur ordre.') ]},
{title:'La tournée alphabétique',place:'Les galeries de la ville',theme:'city',icon:'⌕',level:'Messages secrets',source:'Menace au commissariat',intro:'Une suite de noms révèle peut-être la prochaine cible.',text:[
`Depuis six semaines, une personne remplace les petites étiquettes de tableaux par de fausses descriptions dans les galeries de la ville. Les œuvres ne sont pas endommagées, mais les visiteurs sont trompés. Chaque vendredi, une nouvelle galerie découvre la même carte : « La suite approche. »`,
`Lafouine dresse la liste des lieux touchés, dans l’ordre exact : galerie Aster, galerie Barnard, galerie Colomb, galerie Dirien, galerie Estaing et galerie Ficelle. Ces galeries sont très éloignées les unes des autres. Leurs numéros de rue ne présentent aucune régularité.`,
`La responsable du réseau remet à l’inspecteur la liste des établissements encore intacts : galerie Cartier, galerie Gradube, galerie Patouche et galerie Zola. Elle explique que toutes ouvrent le vendredi. Aucun horaire ne permet donc d’en privilégier une.`,
`Une carte retrouvée à la galerie Ficelle porte une indication supplémentaire : « Pas besoin de carte routière; commencez par la première lettre. » Lafouine souligne alors le début de chaque nom, sans tenir compte du prénom des propriétaires ni de l’emplacement des bâtiments.`,
`Il remarque une suite simple. Cette régularité ne garantit pas que l’auteur continuera de la même façon. Elle permet toutefois de proposer une hypothèse précise et de prévoir une surveillance ciblée pour le prochain vendredi. L’inspecteur écrit le nom de la galerie à surveiller sur son carnet.`],questions:[
Q('Repérer','Que modifie l’auteur des méfaits ?',['Les étiquettes descriptives des tableaux.','Les tableaux eux-mêmes.','Les numéros de rue des galeries.','Les horaires d’ouverture du réseau.'],'Les œuvres restent intactes; ce sont leurs descriptions qui sont remplacées.','Distingue l’œuvre et l’étiquette.'),
Q('Organiser','Quelle suite les premières lettres des lieux touchés forment-elles ?',['A, B, C, D, E, F.','A, C, E, G, I, K.','F, E, D, C, B, A.','A, B, D, G, K, P.'],'L’ordre chronologique des galeries correspond au début de l’alphabet.','Conserve l’ordre donné dans le texte.'),
Q('Déduire','Quelle galerie correspond à la lettre suivante ?',['Gradube.','Cartier.','Patouche.','Zola.'],'Après F vient G; Gradube est le seul nom proposé qui commence par G.','Cherche une initiale, pas une proximité géographique.'),
Q('Évaluer','Quel statut faut-il donner à cette conclusion ?',['Une hypothèse cohérente à vérifier par la surveillance.','Une certitude que personne ne peut remettre en question.','Une preuve de l’identité de l’auteur.','Une preuve que le propriétaire de Gradube est complice.'],'Une suite observée aide à prévoir, mais ne garantit ni l’événement ni l’identité de l’auteur.','Prédire une cible n’identifie pas une personne.') ]},
{title:'Le tableau hors cadre',place:'Musée d’art moderne',theme:'museum',icon:'▣',level:'Croiser les indices',source:'Au musée d’art moderne',intro:'Un passage discret et des horaires à confronter.',text:[
`Au musée d’art moderne, un petit tableau intitulé Neige sur un mur blanc a disparu. Le système d’alarme a été désactivé pour un entretien de 20 h 10 à 20 h 55. Une caméra indépendante montre une silhouette sortir du conduit de service à 20 h 32, emporter l’œuvre et repartir à 20 h 36. Son visage reste caché.`,
`La porte extérieure du conduit est verrouillée par un badge. Le registre indique que le badge numéro 14 l’a ouverte à 20 h 28. Ce badge était attribué à la secrétaire, Léa, mais il pouvait être prêté ou pris dans son bureau. Lafouine évite donc de traiter ce numéro comme une preuve d’identité.`,
`Les deux techniciens sont visibles sans interruption dans la salle de contrôle de 20 h à 21 h. Le conservateur anime une visite filmée dans une autre aile de 20 h 15 à 20 h 45. Madame Ramirez quitte le bâtiment à 20 h 05; les caméras de toutes les entrées confirment qu’elle n’est pas revenue.`,
`Léa affirme : « J’ai quitté le musée à 20 h, avec mon badge dans ma poche. Je ne l’ai prêté à personne. » Pourtant, une caméra de l’accueil la montre encore dans le hall à 20 h 25. Elle reconnaît être la personne filmée, mais maintient son heure de départ.`,
`Lafouine compare les heures. La sortie du tableau est documentée, plusieurs alibis sont vérifiés et une déclaration contredit une image reconnue par l’intéressée. Avant d’accuser quelqu’un du vol, il faut résoudre cette contradiction et retrouver le trajet du badge.`],questions:[
Q('Repérer','Pendant quelle période le tableau est-il emporté selon la caméra ?',['Entre 20 h 32 et 20 h 36.','Entre 20 h et 20 h 05.','Entre 20 h 10 et 20 h 15.','Entre 20 h 55 et 21 h.'],'La silhouette apparaît à 20 h 32 et repart avec l’œuvre à 20 h 36.','Ne confonds pas toute la panne avec le passage filmé.'),
Q('Comprendre','Pourquoi le badge 14 ne prouve-t-il pas, seul, l’identité du voleur ?',['Il pouvait être utilisé par une autre personne.','Il ne permettait pas d’ouvrir le conduit.','Son utilisation n’a pas été enregistrée.','Il appartenait forcément à un technicien.'],'L’attribution d’un badge n’établit pas qui le tient au moment de l’utiliser.','Distingue le propriétaire du badge de son utilisateur.'),
Q('Croiser les indices','Quels faits contredisent directement Léa ?',['Elle dit être partie à 20 h, mais elle est filmée à 20 h 25.','Le tableau est petit, mais le conduit est long.','Le conservateur filme une visite à 20 h 15.','Les techniciens restent à la salle de contrôle.'],'Léa reconnaît la personne filmée tout en maintenant une heure de départ incompatible.','Compare son heure de départ déclarée à une image vérifiée.'),
Q('Conclure','Quelle action Lafouine doit-il privilégier ?',['Vérifier le récit de Léa et le trajet de son badge.','Accuser Ramirez parce qu’elle connaît le musée.','Arrêter les techniciens parce qu’ils ont coupé l’alarme.','Conclure que le tableau n’a jamais quitté la salle.'],'La contradiction de Léa et l’usage du badge sont deux pistes concrètes à approfondir.','Appuie la suite de l’enquête sur les faits, pas sur les métiers.') ]}
];
</script><script>'use strict';
const KEY='bureau-enquetes-v1';
let state={cases:{},cooldown:0,large:false,sound:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.cases&&typeof s.cases==='object')state={...state,...s};}catch(e){}
let current=-1,filter='Tous',storageOK=true,audioContext;
const app=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
function getCase(i){if(!state.cases[i])state.cases[i]={step:0,first:0,errors:{},notes:[],solved:{}};return state.cases[i];}
function remaining(){return Math.max(0,Math.ceil(((Number(state.cooldown)||0)-Date.now())/1000));}
function beep(success){if(!state.sound)return;try{audioContext??=new (window.AudioContext||window.webkitAudioContext)();audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);o.frequency.value=success?660:220;g.gain.setValueAtTime(.05,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.2);o.start();o.stop(audioContext.currentTime+.2);}catch(e){}}
function status(i){const s=getCase(i);return s.step>=4?'classé':s.step>0||s.notes.length||Object.keys(s.errors).length?'en cours':'à ouvrir';}
function home(){current=-1;const done=CASES.filter((c,i)=>getCase(i).step>=4).length;const points=Object.values(state.cases).reduce((n,s)=>n+(s.first||0),0);app.innerHTML=`<section class="hero"><div><div class="eyebrow">Service des affaires à éclaircir</div><h1>Les détails parlent.<br><em>À toi de les lire.</em></h1><p>Un témoignage étrange. Un objet déplacé. Un mot de trop. Entre au bureau de Lafouine et mets ton sens de la déduction à l’épreuve.</p><button class="primary" id="start">${done?'Poursuivre les enquêtes':'Ouvrir mon premier dossier'} <span>→</span></button></div><div class="desk" aria-hidden="true"><span class="desk-label">Tout commence par un indice…</span><div class="dossier"><small>INSPECTEUR LAFOUINE</small><strong>Affaires<br>à éclaircir</strong><span class="stamp">CONFIDENTIEL</span></div><div class="lens"></div></div></section><section class="stats" aria-label="Ta progression"><div><strong>${done}<small style="font-size:14px;color:var(--muted)"> / 12</small></strong><span>dossiers classés</span></div><div class="progress"><i style="width:${done/12*100}%"></i></div><div><strong>${points}<small style="font-size:14px;color:var(--muted)"> / 48</small></strong><span>réponses justes du premier coup</span></div></section><section><div class="section-head"><h2>Choisis ton dossier</h2><div class="filters" aria-label="Filtrer les dossiers">${['Tous','Premiers indices','Croiser les indices','Messages secrets'].map(f=>`<button data-filter="${f}" class="${filter===f?'active':''}" aria-pressed="${filter===f}">${f}</button>`).join('')}</div></div><div class="grid">${CASES.map((c,i)=>filter==='Tous'||filter===c.level?`<button class="card" data-case="${i}"><div class="art ${c.theme}"><span class="num">DOSSIER ${String(i+1).padStart(2,'0')}</span><b aria-hidden="true">${c.icon}</b><span class="tag">${status(i)==='classé'?'✓ Classé':c.level}</span></div><div class="card-body"><small>${c.place}</small><h3>${c.title}</h3><p>${c.intro}</p><div class="card-foot"><span>4 questions · 8–12 min</span><b>${status(i)==='classé'?'Revoir':status(i)==='en cours'?'Reprendre':'Enquêter'} →</b></div></div></button>`:'').join('')}</div></section><aside class="help"><strong>Ta méthode d’enquête</strong><span>Lis le dossier. Marque les passages utiles. Réponds à quatre questions. Après une erreur, prends 45 secondes pour relire avant de réessayer. Le délai reste actif si tu changes de dossier.</span></aside><div class="reset">${!storageOK?'La sauvegarde est indisponible dans ce navigateur. ':''}<button id="reset">Effacer ma progression sur cet appareil</button></div>`;
document.getElementById('start').onclick=()=>openCase(Math.max(0,CASES.findIndex((c,i)=>getCase(i).step<4)));
app.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>openCase(+b.dataset.case));app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;home();});document.getElementById('reset').onclick=()=>{if(confirm('Effacer les réponses et les indices enregistrés pour les 12 dossiers ? Cette action ne peut pas être annulée.')){state.cases={};save();home();}};
}
const CASE_ART={"7-1": {"alt": "Carmen remet une liste à Lafouine dans son bureau.", "width": 1536, "height": 1024}, "7-2": {"alt": "Un atelier de restauration de meubles.", "width": 1536, "height": 1024}, "7-3": {"alt": "Lafouine compare plusieurs maisons.", "width": 1672, "height": 941}, "8-1": {"alt": "Un gardien remet une enveloppe à Lafouine aux archives.", "width": 1672, "height": 941}, "8-2": {"alt": "Une note et son enveloppe reposent près de plans.", "width": 1536, "height": 1024}, "8-3": {"alt": "Lafouine examine une note dans une salle d’archives.", "width": 1672, "height": 941}, "11-1": {"alt": "Lafouine examine une étiquette sous un tableau intact.", "width": 1536, "height": 1024}, "11-2": {"alt": "La responsable des galeries remet un document à Lafouine.", "width": 1536, "height": 1024}, "11-3": {"alt": "Lafouine note une hypothèse dans son carnet.", "width": 1536, "height": 1024}, "9-2": {"alt": "Une lettre à examiner repose sur un bureau.", "width": 1536, "height": 1024}, "9-3": {"alt": "Le jardin de l’exposition, avec une fontaine, une statue et un banc.", "width": 1536, "height": 1024}, "10-1": {"alt": "Lafouine et un notaire devant quatre enveloppes scellées.", "width": 1536, "height": 1024}, "10-2": {"alt": "Quatre enveloppes et une carte sur une table.", "width": 1536, "height": 1024}, "10-3": {"alt": "Une plage sur laquelle des déchets sont éparpillés.", "width": 1672, "height": 941}, "12-1": {"alt": "Lafouine examine l’emplacement vide d’un tableau au musée.", "width": 1672, "height": 941}, "12-2": {"alt": "Lafouine observe une trappe fermée et un lecteur de badge.", "width": 1536, "height": 1024}, "12-3": {"alt": "Lafouine et deux techniciens consultent des moniteurs de surveillance.", "width": 1672, "height": 941}, "9-1": {"alt": "Une vitrine vide dans une exposition de minéraux.", "width": 1536, "height": 1024}, "5-1": {"alt": "Malus présente une enveloppe à Lafouine dans son cabinet.", "width": 1536, "height": 1024}, "5-2": {"alt": "Lafouine examine une déclaration remise par l’assureur.", "width": 1536, "height": 1024}, "5-3": {"alt": "Lafouine tourne les pages d’un livre ordinaire.", "width": 1536, "height": 1024}, "6-1": {"alt": "Deux policiers rejoignent Lafouine et Jo Vial sur la jetée.", "width": 1536, "height": 1024}, "6-2": {"alt": "Lafouine recueille un témoignage au café du port.", "width": 1536, "height": 1024}, "6-3": {"alt": "Lafouine observe les poissons dans un panier sur le quai.", "width": 1536, "height": 1024}, "1-2": {"alt": "Une radio à piles, des mots croisés et une bougie.", "width": 1536, "height": 1024}, "1-3": {"alt": "Lafouine compare ses notes près d’un téléviseur.", "width": 1536, "height": 1024}, "2-1": {"alt": "Le bureau du directeur du cirque, sans la mallette.", "width": 1536, "height": 1024}, "2-2": {"alt": "Lafouine recueille les déclarations de quatre employés du cirque.", "width": 1536, "height": 1024}, "2-3": {"alt": "Une meule sous l’auvent d’une caravane.", "width": 1536, "height": 1024}, "1-1": {"alt": "Lafouine découvre la vitrine intacte et vide au château.", "width": 1536, "height": 1024}, "3-1": {"alt": "Un coffre ouvert et une fenêtre endommagée au château.", "width": 1536, "height": 1024}, "3-2": {"alt": "Lafouine et l’expert observent des éclats sur la terrasse.", "width": 1536, "height": 1024}, "3-3": {"alt": "Lafouine examine des documents avant toute signature.", "width": 1536, "height": 1024}, "4-1": {"alt": "La table d’un petit déjeuner interrompu au manoir.", "width": 1536, "height": 1024}, "4-2": {"alt": "Lafouine s’entretient avec Hélène, Sophie et George.", "width": 1536, "height": 1024}, "4-3": {"alt": "Lafouine écoute attentivement les paroles de George.", "width": 1536, "height": 1024}};
function caseIllustration(i,j){const scene=({0:1,2:2,4:3})[j];if(!scene)return '';const art=CASE_ART[`${i+1}-${scene}`]||{alt:`Illustration du dossier ${i+1}, scène ${scene}.`,width:1536,height:1024};return `<figure class="story-illustration"><img src="assets/bureau-c${i+1}-${scene}.webp" alt="${art.alt.replaceAll('"','&quot;')}" width="${art.width}" height="${art.height}" loading="${scene===1?'eager':'lazy'}" decoding="async"></figure>`;}
function openCase(i){current=i;const c=CASES[i],s=getCase(i);app.innerHTML=`<div class="case-top"><button class="back" id="back">← Retour aux dossiers</button><span class="eyebrow">Dossier ${String(i+1).padStart(2,'0')} / 12 · ${c.level}</span></div><div class="case-title"><div class="eyebrow">${c.place}</div><h1>${c.title}</h1></div><div class="workbench"><article class="paper"><div class="paper-top"><span>RAPPORT D’OBSERVATION</span><span>${c.icon} ${String(i+1).padStart(2,'0')}</span></div><h2>Les faits</h2><p class="instructions">Clique sur un passage pour le marquer et l’ajouter à ton carnet. Au clavier, sélectionne le passage avec Tab, puis Entrée. Le texte reste accessible pendant les questions.</p><p class="illustration-notice">Illustrations générées. Les indices et les preuves proviennent du texte.</p>${c.text.map((p,j)=>`<p class="paragraph ${p.includes('\n')?'code':''} ${s.notes.includes(j)?'marked':''}" tabindex="0" role="button" aria-pressed="${s.notes.includes(j)}" aria-label="Marquer le passage ${j+1} : ${p.replaceAll('"','&quot;').replaceAll('\n',' ')}" data-note="${j}">${p}</p>${caseIllustration(i,j)}`).join('')}<div class="source">Adaptation libre de « ${c.source} ». Texte et indices remaniés pour cette activité de lecture.</div></article><aside class="side"><section class="question-box" id="question"></section><section class="notebook" id="notes"></section><p class="notice">${storageOK?'Ta progression est sauvegardée automatiquement sur cet appareil.':'La sauvegarde est indisponible; garde cette page ouverte.'}</p></aside></div>`;
document.getElementById('back').onclick=()=>{home();window.scrollTo(0,0);};app.querySelectorAll('[data-note]').forEach(p=>{const toggle=()=>{const n=+p.dataset.note;s.notes=s.notes.includes(n)?s.notes.filter(x=>x!==n):[...s.notes,n];s.notes.sort((a,b)=>a-b);p.classList.toggle('marked',s.notes.includes(n));p.setAttribute('aria-pressed',s.notes.includes(n));save();renderNotes();};p.onclick=toggle;p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}};});renderQuestion();renderNotes();window.scrollTo(0,0);
}
function renderNotes(){if(current<0)return;const s=getCase(current),c=CASES[current];document.getElementById('notes').innerHTML=`<h3>✎ Mon carnet d’indices <small>(${s.notes.length})</small></h3>${s.notes.length?`<ul>${s.notes.map(n=>`<li>${c.text[n].slice(0,160)}${c.text[n].length>160?'…':''}</li>`).join('')}</ul><p>Les passages marqués restent surlignés dans le rapport.</p>`:'<p>Aucun passage marqué pour le moment. Repère une heure, une parole ou un détail matériel dans le texte.</p>'}`;}
function order(i,q){const a=[0,1,2,3];let seed=(i+1)*127+(q+1)*71;for(let j=3;j>0;j--){seed=(seed*9301+49297)%233280;const k=seed%(j+1);[a[j],a[k]]=[a[k],a[j]];}return a;}
function renderQuestion(){if(current<0)return;const i=current,c=CASES[i],s=getCase(i),box=document.getElementById('question');if(s.step>=4){box.innerHTML=`<div class="complete"><div class="eyebrow">Enquête terminée</div><div class="stamp">Dossier classé</div><h2>${s.first===4?'Un regard affûté.':s.first>=2?'Les indices prennent sens.':'La persévérance fait progresser.'}</h2><p>Tu as résolu les quatre questions.<br><strong>${s.first} / 4</strong> réponses justes dès le premier essai.</p><button class="primary" id="nextcase">${i<11?'Dossier suivant':'Retour au bureau'} <span>→</span></button><details><summary>Revoir mon raisonnement</summary>${c.questions.map((q,j)=>`<p><strong>${j+1}. ${q.prompt}</strong><br>${q.why}</p>`).join('')}</details></div>`;document.getElementById('nextcase').onclick=()=>i<11?openCase(i+1):(home(),window.scrollTo(0,0));return;}
const n=s.step,q=c.questions[n],solved=!!s.solved[n];box.innerHTML=`<div class="steps" aria-label="Question ${n+1} sur 4">${[0,1,2,3].map(k=>`<span class="${k<n?'done':k===n?'current':''}"></span>`).join('')}</div><div class="qmeta">Question ${n+1} / 4 · ${q.skill}</div><h2 id="qtitle" tabindex="-1">${q.prompt}</h2><div class="answers">${order(i,n).map((a,j)=>`<button class="answer ${solved&&a===0?'correct':''}" data-answer="${a}" ${solved||remaining()?'disabled':''}><span>${String.fromCharCode(65+j)}</span>${q.answers[a]}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div>`;
box.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer,b));if(solved)showSuccess(q);else if(remaining())showWait(q);else if(s.errors[n])document.getElementById('feedback').innerHTML=`<strong>À toi de reprendre.</strong>${q.hint}`;
}
function showSuccess(q){document.getElementById('feedback').innerHTML=`<strong>✓ Raisonnement validé.</strong>${q.why}<button class="primary" id="continue">${getCase(current).step===3?'Classer ce dossier':'Question suivante'} <span>→</span></button>`;document.getElementById('continue').onclick=()=>{getCase(current).step++;save();renderQuestion();const t=document.getElementById('qtitle');if(t)t.focus({preventScroll:true});};}
function showWait(q){document.getElementById('feedback').innerHTML=`<strong>Retourne aux indices.</strong>${q.hint}<span class="timer" role="timer" aria-live="off">Nouvel essai dans <b id="seconds">${remaining()}</b> s</span>`;}
function answer(a,b){const s=getCase(current),n=s.step;if(remaining()||s.solved[n]||n>=4)return;const q=CASES[current].questions[n];if(a===0){s.solved[n]=true;if(!s.errors[n])s.first++;save();beep(true);renderQuestion();}else{s.errors[n]=(s.errors[n]||0)+1;state.cooldown=Date.now()+45000;save();beep(false);b.classList.add('wrong');document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);showWait(q);}}
setInterval(()=>{if(current<0)return;const s=getCase(current);if(s.step>=4||s.solved[s.step])return;const timer=document.getElementById('seconds');if(timer){const r=remaining();if(r)timer.textContent=r;else renderQuestion();}},250);
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{const incoming=JSON.parse(e.newValue);if(incoming&&incoming.cases){state={...state,...incoming};if(current>=0)openCase(current);else home();}}catch(err){}});
document.getElementById('home').onclick=()=>{home();window.scrollTo(0,0);};document.getElementById('size').onclick=()=>{state.large=!state.large;document.body.classList.toggle('large',state.large);document.getElementById('size').textContent=state.large?'A−':'A+';save();};document.getElementById('sound').onclick=()=>{state.sound=!state.sound;document.getElementById('sound').textContent=state.sound?'Son : oui':'Son : non';document.getElementById('sound').setAttribute('aria-pressed',state.sound);save();if(state.sound)beep(true);};document.body.classList.toggle('large',state.large);document.getElementById('size').textContent=state.large?'A−':'A+';document.getElementById('sound').textContent=state.sound?'Son : oui':'Son : non';document.getElementById('sound').setAttribute('aria-pressed',state.sound);home();
</script></body></html>
